name: CI

on:
  push:
    branches: [demo/portfolio-showcase, main]
  pull_request:
    branches: [demo/portfolio-showcase, main]

jobs:
  host-unit-tests:
    name: Host unit tests (GPIO Pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build lcov

      - name: Configure, test, and capture coverage
        run: |
          cmake -S tests -B build-tests -G Ninja -DENABLE_COVERAGE=ON
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure
          lcov --capture --directory build-tests --output-file build-tests/coverage.info \
            --rc branch_coverage=1 --ignore-errors mismatch,negative
          lcov --remove build-tests/coverage.info \
            '*/tests/*' '*/_deps/*' '*/build-tests/*' '/usr/*' \
            --output-file build-tests/coverage.info --ignore-errors unused,negative

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-tests/coverage.info
          flags: host-unit-tests
          name: pin-gpio-coverage
          fail_ci_if_error: false
          verbose: true

  firmware-cross-build:
    name: Cross-compile STM32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure File API query (CMake Tools compatible)
        run: |
          mkdir -p build/.cmake/api/v1/query/client-vscode
          cat > build/.cmake/api/v1/query/client-vscode/query.json << 'EOF'
          {
            "requests": [
              { "kind": "cache", "version": 2 },
              { "kind": "codemodel", "version": 2 },
              { "kind": "toolchains", "version": 1 },
              { "kind": "cmakeFiles", "version": 1 }
            ]
          }
          EOF

      - name: Build firmware
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          arm-none-eabi-size build/PROJECT_V001.elf
