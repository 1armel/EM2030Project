name: CI

on:
  push:
    branches: [demo/portfolio-showcase, main]
  pull_request:
    branches: [demo/portfolio-showcase, main]

jobs:
  host-unit-tests:
    name: Host unit tests (GPIO Pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure and run tests
        run: |
          cmake -S tests -B build-tests -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  firmware-cross-build:
    name: Cross-compile STM32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure File API query (CMake Tools compatible)
        run: |
          mkdir -p build/.cmake/api/v1/query/client-vscode
          cat > build/.cmake/api/v1/query/client-vscode/query.json << 'EOF'
          {
            "requests": [
              { "kind": "cache", "version": 2 },
              { "kind": "codemodel", "version": 2 },
              { "kind": "toolchains", "version": 1 },
              { "kind": "cmakeFiles", "version": 1 }
            ]
          }
          EOF

      - name: Build firmware
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          arm-none-eabi-size build/PROJECT_V001.elf
