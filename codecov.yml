codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "**/_deps/**"
  - "build-tests/**"
  - "build/**"
  - "Driver/CMSIS/**"
  - "Driver/STM32F429/Src/startup_*"
  - "Driver/STM32F429/Src/system_*"
  - "Driver/STM32F429/Src/stm32f4xx_*"
